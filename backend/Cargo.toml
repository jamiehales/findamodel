[package]
name = "findamodel"
version = "0.1.0"
edition = "2024"
description = "findamodel backend: 3D model catalog, previews and print plate generation"
license = "MIT"
publish = false

[lib]
name = "findamodel"
path = "src/lib.rs"

[[bin]]
name = "findamodel"
path = "src/main.rs"

[dependencies]
adler2 = "2"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["query"] }
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
croner = "2"
fancy-regex = "0.14"
flate2 = "1"
futures = "0.3"
glam = "0.30"
hex = "0.4"
log = "0.4"
mime = "0.3"
parking_lot = "0.12"
png = "0.17"
pollster = "0.4"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
spade = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "25"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
roxmltree = "0.20"
tempfile = "3"
