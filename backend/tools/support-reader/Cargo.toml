[package]
name = "support-reader-tool"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs the backend's support reader on STL files, for the DragonFruit round trip and prototype comparisons"

[dependencies]
findamodel = { path = "../.." }
serde_json = "1"
rayon = "1"
flate2 = "1"

[profile.release]
opt-level = 3

# Not a member of the repository's workspace: it is built on its own (see README.md).
[workspace]
