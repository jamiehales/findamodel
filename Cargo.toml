[workspace]
resolver = "3"
members = ["backend", "desktop-tauri/src-tauri"]

[profile.dev]
opt-level = 1

# Geometry parsing, hull calculation and preview rendering are slow when unoptimised,
# so dependencies are always built with optimisations, even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
