[package]
name = "findamodel-desktop"
version = "0.1.0"
description = "findamodel desktop shell"
authors = ["findamodel"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
findamodel = { path = "../../backend" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0", features = [] }
ureq = "2.10"
